[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-support-conversations"
version = "0.1.0"
description = "OpenEnv environment for evaluating agents on emotional support conversations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openenv-core>=0.2.0",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "httpx==0.27.2",
  "openai>=2.7.2,<3",
  "torch>=2.2",
  "transformers>=4.46",
  "datasets>=3.0",
  "trl>=0.11",
  "matplotlib>=3.8",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["inference", "benchmark", "benchmark_agentic", "benchmark_agentic_llm", "benchmark_llm", "train_trl"]

[tool.setuptools.packages.find]
include = ["src*", "server*"]
