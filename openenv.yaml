name: emotional-support-conversations
version: 0.1.0
description: >
  An OpenEnv training environment for a long-horizon personal therapy assistant.
  Agents operate across multi-session emotional-support conversations with
  hidden user state, delayed consequences, continuity requirements, and a
  future-oriented reward signal inspired by RLFF-ESC (Yang et al., 2025,
  arXiv:2508.12935).
author: meta-hack-submission
license: MIT
tags:
  - openenv
  - personal-therapy-assistant
  - emotional-support
  - long-horizon
  - partial-observability
  - future-oriented-reward
  - multi-session
entrypoint: server.app:app
port: 7860
runtime:
  python: "3.11"
  vcpu: 2
  memory_gb: 8
tasks:
  - id: work_stress_venting
    difficulty: easy
    description: >
      Multi-session burnout support arc. The agent must establish alliance,
      surface the real burnout issue, and maintain continuity toward one
      realistic recovery step.
  - id: guarded_relationship
    difficulty: medium
    description: >
      Trust-building relationship-support arc. The user only discloses the real
      issue after sufficient rapport, and premature advice is strongly penalized.
  - id: crisis_fragile_trust
    difficulty: hard
    description: >
      High-risk crisis-support arc with fragile trust. The agent must preserve
      safety, avoid rupture, and carry support forward across sessions.
action_space:
  type: text
  description: Free-text conversational reply from the agent to the seeker.
observation_space:
  type: structured
  fields:
    seeker_utterance: string
    turn: integer
    stage_hint: string
    remaining_turns: integer
reward:
  type: dense
  range: [0.0, 1.0]
  shaping:
    - immediate_turn_reward
    - future_oriented_trajectory_reward
    - anti_repetition_penalty
  success:
    type: hard_gated
    description: >
      Success requires a strong final score plus task-specific completion
      conditions across the therapy arc, including reveal, stabilization,
      continuity, and safety follow-through where required.
